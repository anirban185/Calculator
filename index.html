<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="Style.css" rel="Stylesheet">
        <title> Calculator </title>
    </head>
    <body>
        <main>
            <div id="Display">
            </div>

            <div id="Key-Pad">
                <div id="Num-Pad">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>00</button>
                    <button>0</button>
                    <button>.</button>
                </div>
                <div id="Op-Pad">
                    <button>+</button>
                    <button>-</button>
                    <button>*</button>
                    <button>/</button>
                </div>
                <div id="Fn-Pad">
                    <button id="Equal">=</button>
                    <button>DEL</button>
                    <button>C</button>
                    <button>%</button>
                </div>
            </div>
        </main>
        <footer>
            <p>© 2026 <a href="https://github.com/anirban185">Anirban</a>. All rights reserved.</p>
        </footer>
        <script src="Script.js"></script>
    </body>
</html>
